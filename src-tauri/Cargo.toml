[package]
name = "restool"
version = "0.1.0"
description = "Desktop REST client for Ubuntu"
authors = ["restool"]
edition = "2021"

[lib]
name = "restool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["json", "rustls", "gzip", "brotli", "deflate", "cookies"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
url = "2.5.8"
thiserror = "2.0.19"
anyhow = "1.0.104"
dirs = "6.0.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
urlencoding = "2.1.3"

[dev-dependencies]
